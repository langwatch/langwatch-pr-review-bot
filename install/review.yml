# Copy this file to .github/workflows/review.yml in your repository.
# The action (langwatch/langwatch-pr-review-bot) owns the rules, agent, and
# skills. The runner fetches the action's own repo, so no REVIEW_RULES.md or
# .claude/ files are needed in your repo. You customize only through inputs.
name: PR Review Bot
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  # contents: write lets the default GITHUB_TOKEN resolve fixed findings' threads
  # (resolveReviewThread). Drop it to contents: read if you do not want thread resolution.
  contents: write
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head so the action can diff and inspect the working tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Pin this to a reviewed commit SHA if your repository requires SHA-pinned actions (see README).
      - uses: langwatch/langwatch-pr-review-bot@main
        with:
          slack_notify: "false"
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          langwatch_ingest_key: ${{ secrets.LANGWATCH_INGEST_KEY }}
