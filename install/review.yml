# Copy this file to .github/workflows/review.yml in your repository.
# The bot repo (langwatch/langwatch-pr-review-bot) owns the rules, agent, and
# skills. You customize only through the inputs below — no REVIEW_RULES.md or
# .claude/ files are needed in your repo.
name: PR Review Bot
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    uses: langwatch/langwatch-pr-review-bot/.github/workflows/review.yml@main
    with:
      review_label: ai-review
      slack_notify: false
      extra_instructions: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LANGWATCH_INGEST_KEY: ${{ secrets.LANGWATCH_INGEST_KEY }}
