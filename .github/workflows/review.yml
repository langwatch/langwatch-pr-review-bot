name: PR Review Bot

# Dogfooding: this repo reviews its own PRs by calling its own composite action.
# Inputs are left at their defaults (always-on, Slack enabled, base_branch=main).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: PR Review Bot
    runs-on: ubuntu-latest
    steps:
      # The PR working tree at PR head — the code the action reviews.
      # fetch-depth 0 so the PR base sha is in history for the diff.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # This repo's own dogfood workflow intentionally runs the action from the PR under
      # review, not a pinned ref. This is NOT a trust boundary for this repo — only for
      # installed/consumer repos, which use a pinned `uses:` ref instead of `./`.
      - uses: ./
        with:
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          langwatch_ingest_key: ${{ secrets.LANGWATCH_INGEST_KEY }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
