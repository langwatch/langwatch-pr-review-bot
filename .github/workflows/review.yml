name: PR Review Bot

# Dogfooding: this repo reviews its own PRs by calling its own composite action.
# Throwaway proof PR: base_branch and extra_instructions are set so the action
# reviews this PR against feat/self-cleaning-threads instead of skipping it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: PR Review Bot
    runs-on: ubuntu-latest
    steps:
      # The PR working tree at PR head — the code the action reviews.
      # fetch-depth 0 so the PR base sha is in history for the diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # This repo's own dogfood workflow intentionally runs the action from the PR under
      # review, not a pinned ref. This is NOT a trust boundary for this repo — only for
      # installed/consumer repos, which use a pinned `uses:` ref instead of `./`.
      - uses: ./
        with:
          base_branch: feat/self-cleaning-threads
          extra_instructions: "Throwaway proof PR (do not merge) validating PR #10 self-cleaning. The base_branch override and everything under proof/ are intentional test scaffolding; treat them as out of scope and do not report findings on them."
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          langwatch_ingest_key: ${{ secrets.LANGWATCH_INGEST_KEY }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
