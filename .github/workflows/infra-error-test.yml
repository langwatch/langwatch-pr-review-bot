name: Infra error test

# Proves issue #18: an infra error (here, an invalid Claude token making the API call
# fail) ends the job green and posts a COMMENT saying the review could not run, never
# APPROVE or REQUEST_CHANGES. To run it, add the `test:infra-error` label to a PR; PRs
# without the label skip the review, so they never get the notice.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  infra-error:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: ./
        id: action
        with:
          # Non-empty but invalid: the auth-presence check passes, the API call fails.
          claude_oauth_token: 'sk-ant-oat01-invalid-token-for-infra-error-test'
          review_label: 'test:infra-error'
          slack_notify: 'false'

      # Reaching this step proves the action step passed (the job is green so far).
      - name: Assert the infra path
        if: contains(github.event.pull_request.labels.*.name, 'test:infra-error')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          START_AT: ${{ steps.start.outputs.at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reviews="$(gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate | jq -s 'add // []')"
          notices="$(jq --arg sha "$HEAD_SHA" --arg url "$RUN_URL" '[.[] | select(.commit_id == $sha and .state == "COMMENTED" and ((.body // "") | contains("<!-- review-infra-error -->")) and ((.body // "") | contains($url)))] | length' <<< "$reviews")"
          # review.yml does not trigger on `labeled`, so adding the label gives a window
          # no dogfood run writes into.
          verdicts="$(jq --arg sha "$HEAD_SHA" --arg start "$START_AT" '[.[] | select(.commit_id == $sha and .submitted_at >= $start and (.state == "APPROVED" or .state == "CHANGES_REQUESTED") and ((.body // "") | startswith("**@LangWatchReviewBot**")))] | length' <<< "$reviews")"
          echo "infra notices on head: $notices; approve/request-changes bot reviews on head: $verdicts"
          if [[ "$notices" -lt 1 ]]; then
            echo "::error::No COMMENTED review-could-not-run notice found on the head commit."
            exit 1
          fi
          if [[ "$verdicts" -ne 0 ]]; then
            echo "::error::The bot posted an APPROVED or CHANGES_REQUESTED review on an infra error."
            exit 1
          fi
