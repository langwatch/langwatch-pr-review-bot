name: Install fake claude
description: Put a fake claude on PATH that returns the verdict in FAKE_REVIEW_JSON, with no API call.
runs:
  using: composite
  steps:
    # Prepended to PATH so it shadows the npm-installed claude.
    - shell: bash
      run: |
        dir="$RUNNER_TEMP/fake-claude"
        mkdir -p "$dir"
        cat > "$dir/claude" <<'FAKE'
        #!/usr/bin/env bash
        if [[ "${1:-}" == "--version" ]]; then
          echo "fake-claude 0.0.0"
          exit 0
        fi
        jq -n --arg r "$FAKE_REVIEW_JSON" '{type:"result",subtype:"success",is_error:false,session_id:"fake-session",result:$r}'
        FAKE
        chmod +x "$dir/claude"
        echo "$dir" >> "$GITHUB_PATH"
